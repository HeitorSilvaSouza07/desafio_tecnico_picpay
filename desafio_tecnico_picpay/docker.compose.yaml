name: desafio_tecnico_picpay

service:

  api: 
    build:
      context: . 
      dockerfile: Dockerfile
      env_file:
        - .env
      ports:
        - "8000:8000"

  db:
    image: postgres:15.3-alpine
    container_name: desafio_tecnico_picpay_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"